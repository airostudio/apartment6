<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Cascade Apartment 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:        #0f2744;
      --primary-light:  #1a3a5c;
      --primary-dark:   #091b30;
      --gold:           #c9a84c;
      --gold-hover:     #b8963e;
      --white:          #ffffff;
      --off-white:      #f7f8fa;
      --border:         #e2e6ed;
      --text:           #1a2940;
      --muted:          #6b7a90;
      --error-bg:       #fff1f1;
      --error-border:   #f5c6c6;
      --error-text:     #c0392b;
      --success-bg:     #f0faf4;
      --success-border: #a8d5b8;
      --success-text:   #1e7e44;
      --radius:         10px;
      --shadow:         0 8px 32px rgba(15,39,68,0.13);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--off-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ---- Header strip ---- */
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: var(--white);
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    .login-header-badge svg {
      width: 16px;
      height: 16px;
      opacity: 0.8;
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .login-header p {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ---- Card ---- */
    .login-card {
      background: var(--primary);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 40px;
      width: 100%;
      max-width: 420px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 28px;
    }

    /* ---- Form ---- */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.80);
      margin-bottom: 7px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 7px;
      color: var(--white);
      transition: border-color 0.18s, background 0.18s;
      outline: none;
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder {
      color: rgba(255,255,255,0.30);
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--gold);
      background: rgba(255,255,255,0.11);
    }

    /* ---- Confirm field (setup mode only) ---- */
    #confirmGroup {
      display: none;
    }

    /* ---- Button ---- */
    .btn-login {
      display: block;
      width: 100%;
      padding: 13px 20px;
      margin-top: 26px;
      background: var(--gold);
      color: var(--primary-dark);
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn-login:hover {
      background: var(--gold-hover);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ---- Alert messages ---- */
    .alert {
      display: none;
      padding: 11px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 16px;
    }

    .alert-error {
      background: rgba(192,57,43,0.15);
      border: 1px solid rgba(192,57,43,0.35);
      color: #f7a8a0;
    }

    .alert-success {
      background: rgba(30,126,68,0.18);
      border: 1px solid rgba(30,126,68,0.35);
      color: #7edda8;
    }

    .alert.visible {
      display: block;
    }

    /* ---- Divider ---- */
    .card-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.10);
      margin: 24px 0 20px;
    }

    .card-footer-note {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      text-align: center;
    }

    /* ---- Loading spinner inside button ---- */
    .btn-login .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(15,39,68,0.3);
      border-top-color: var(--primary-dark);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .login-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="login-header">
    <div class="login-header-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Cascade Apartment 6 — Admin
    </div>
    <h1 id="pageTitle">Welcome back</h1>
    <p id="pageSubtitle">Sign in to manage your property</p>
  </div>

  <!-- Card -->
  <div class="login-card">
    <h2 class="card-title" id="cardTitle">Sign In</h2>
    <p class="card-subtitle" id="cardSubtitle">Enter your credentials to continue</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="info@cascade6.com.au"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="form-group" id="confirmGroup">
        <label for="confirmPassword">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Repeat your password"
          autocomplete="new-password"
        >
      </div>

      <div class="alert alert-error"   id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>

      <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
    </form>

    <hr class="card-divider">
    <p class="card-footer-note">Cascade Apartment 6 &mdash; Secure Admin Portal</p>
  </div>

  <script>
    (function () {
      // -----------------------------------------------------------------------
      // Determine mode: login vs. first-time setup
      // -----------------------------------------------------------------------
      const params    = new URLSearchParams(window.location.search);
      let   setupMode = params.get('setup') === 'true';

      const pageTitle      = document.getElementById('pageTitle');
      const pageSubtitle   = document.getElementById('pageSubtitle');
      const cardTitle      = document.getElementById('cardTitle');
      const cardSubtitle   = document.getElementById('cardSubtitle');
      const confirmGroup   = document.getElementById('confirmGroup');
      const confirmInput   = document.getElementById('confirmPassword');
      const submitBtn      = document.getElementById('submitBtn');
      const alertError     = document.getElementById('alertError');
      const alertSuccess   = document.getElementById('alertSuccess');
      const form           = document.getElementById('loginForm');
      const emailInput     = document.getElementById('email');
      const passwordInput  = document.getElementById('password');

      function applyMode() {
        if (setupMode) {
          pageTitle.textContent    = 'First-time Setup';
          pageSubtitle.textContent = 'Create a password to secure the admin panel';
          cardTitle.textContent    = 'Set Up Admin Password';
          cardSubtitle.textContent = 'Choose a strong password for info@cascade6.com.au';
          confirmGroup.style.display = 'block';
          confirmInput.required      = true;
          submitBtn.textContent      = 'Create Password & Sign In';
          passwordInput.setAttribute('autocomplete', 'new-password');
        } else {
          pageTitle.textContent    = 'Welcome back';
          pageSubtitle.textContent = 'Sign in to manage your property';
          cardTitle.textContent    = 'Sign In';
          cardSubtitle.textContent = 'Enter your credentials to continue';
          confirmGroup.style.display = 'none';
          confirmInput.required      = false;
          submitBtn.textContent      = 'Sign In';
          passwordInput.setAttribute('autocomplete', 'current-password');
        }
      }

      // -----------------------------------------------------------------------
      // If no ?setup param, auto-detect by checking /api/auth/check
      // (server redirects here with ?setup=true when no password is set,
      //  but this provides a fallback for direct visits)
      // -----------------------------------------------------------------------
      if (!setupMode) {
        fetch('/api/auth/check')
          .then(r => r.json())
          .then(data => {
            if (data.authenticated) {
              // Already logged in — go to dashboard
              window.location.href = '/admin/index.html';
            }
          })
          .catch(() => { /* silently ignore network issues */ });
      }

      applyMode();

      // -----------------------------------------------------------------------
      // Helpers
      // -----------------------------------------------------------------------
      function showError(msg) {
        alertError.textContent = msg;
        alertError.classList.add('visible');
        alertSuccess.classList.remove('visible');
      }

      function showSuccess(msg) {
        alertSuccess.textContent = msg;
        alertSuccess.classList.add('visible');
        alertError.classList.remove('visible');
      }

      function clearAlerts() {
        alertError.classList.remove('visible');
        alertSuccess.classList.remove('visible');
      }

      function setLoading(loading) {
        if (loading) {
          submitBtn.disabled   = true;
          submitBtn.innerHTML  = '<span class="spinner"></span> Please wait…';
        } else {
          submitBtn.disabled   = false;
          submitBtn.textContent = setupMode ? 'Create Password & Sign In' : 'Sign In';
        }
      }

      // -----------------------------------------------------------------------
      // Form submit
      // -----------------------------------------------------------------------
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearAlerts();

        const email           = emailInput.value.trim();
        const password        = passwordInput.value;
        const confirmPassword = confirmInput.value;

        // Basic client-side validation
        if (!email || !password) {
          showError('Please enter your email and password.');
          return;
        }

        if (setupMode) {
          if (!confirmPassword) {
            showError('Please confirm your password.');
            return;
          }
          if (password !== confirmPassword) {
            showError('Passwords do not match.');
            return;
          }
          if (password.length < 8) {
            showError('Password must be at least 8 characters.');
            return;
          }
        }

        setLoading(true);

        try {
          const endpoint = setupMode ? '/api/auth/setup' : '/api/auth/login';
          const body     = setupMode
            ? { email, password, confirmPassword }
            : { email, password };

          const res  = await fetch(endpoint, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify(body)
          });

          const data = await res.json();

          if (res.ok && data.success) {
            showSuccess(setupMode ? 'Password created! Redirecting…' : 'Login successful! Redirecting…');
            setTimeout(() => {
              window.location.href = data.redirect || '/admin/index.html';
            }, 600);
          } else {
            // Handle server-side "setup required" hint from login endpoint
            if (data.setupRequired) {
              setupMode = true;
              applyMode();
              showError('No password is set yet. Please create one below.');
            } else {
              showError(data.error || 'Something went wrong. Please try again.');
            }
            setLoading(false);
          }
        } catch (err) {
          showError('Could not connect to the server. Please try again.');
          setLoading(false);
        }
      });

      // Pre-fill email for convenience
      emailInput.value = 'info@cascade6.com.au';
    })();
  </script>
</body>
</html>
