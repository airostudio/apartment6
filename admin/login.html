<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Cascade Apartment 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f2744;
            letter-spacing: -0.02em;
        }

        .login-logo-badge {
            display: inline-block;
            background: #c9a84c;
            color: #fff;
            font-size: 0.625rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-left: 6px;
            vertical-align: middle;
        }

        .login-title {
            font-size: 1.375rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9375rem;
            font-family: inherit;
            color: #0f172a;
            background: #f8fafc;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #0f2744;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(15, 39, 68, 0.1);
        }

        .form-input::placeholder { color: #94a3b8; }

        .form-error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            color: #dc2626;
        }

        .form-error.visible { display: block; }

        .btn-login {
            width: 100%;
            height: 48px;
            background: #0f2744;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 0.5rem;
        }

        .btn-login:hover { background: #1a3a5c; }
        .btn-login:active { background: #091b30; }
        .btn-login:disabled { background: #94a3b8; cursor: not-allowed; }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8125rem;
            color: #94a3b8;
        }

        .demo-info {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-top: 1.5rem;
            font-size: 0.8125rem;
            color: #0369a1;
        }

        .demo-info strong { display: block; margin-bottom: 0.25rem; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <span class="login-logo-text">Cascade Apartment 6</span>
        <span class="login-logo-badge">Admin</span>
    </div>

    <h1 class="login-title">Sign in to Admin</h1>
    <p class="login-subtitle">Enter your credentials to access the dashboard.</p>

    <div class="form-error" id="loginError">
        Invalid email or password. Please try again.
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" name="email" class="form-input"
                   placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input"
                   placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>

    <div class="login-footer">
        &copy; 2026 Cascade Apartment 6. All rights reserved.
    </div>
</div>

<script>
(function() {
    'use strict';

    // If already logged in, redirect to dashboard
    if (localStorage.getItem('trendaccom_admin_auth')) {
        window.location.href = 'index.html';
    }

    const form     = document.getElementById('loginForm');
    const errorEl  = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorEl.classList.remove('visible');
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in…';

        const email    = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/admin-login', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email, password }),
            });
            const data = await res.json();

            if (res.ok && data.ok) {
                const session = {
                    email:    data.email,
                    role:     data.role,
                    name:     data.name,
                    adminKey: password,
                    loginAt:  Date.now(),
                };
                localStorage.setItem('trendaccom_admin_auth', JSON.stringify(session));

                let redirect = new URLSearchParams(window.location.search).get('redirect') || '';
                if (!redirect || !redirect.startsWith('/admin/')) redirect = '/admin/index.html';
                window.location.href = redirect;
            } else {
                throw new Error(data.error || 'Login failed.');
            }
        } catch (err) {
            errorEl.textContent = err.message || 'Invalid email or password. Please try again.';
            errorEl.classList.add('visible');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    });
})();
</script>
</body>
</html>
